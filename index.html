    <script>
      /* Ensure window.fetch is writable with getter & setter to prevent
         "TypeError: Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          function defineFetchAccessor(target) {
            if (!target) return false;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
              return true;
            } catch (e) {
              return false;
            }
          }

          defineFetchAccessor(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchAccessor(Window.prototype);
          }
        } catch (e) {}

        // Global safeguard for unhandled getter assignment errors
        window.addEventListener(
          'error',
          function(e) {
            if (e && e.message && e.message.includes('fetch of #<Window>')) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
